<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claw'dbot</title>
<style>
  /* html/body must stay transparent or WebView2 paints white (plan §window) */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; }

  /* browser-demo desk backgrounds — added by script, never in Tauri */
  body.demo-dark  { background: #1e1f24; }
  body.demo-light { background: #e8e6e1; }

  #pet-wrap {
    position: fixed;
    right: 40px; bottom: 24px;
    width: 160px; height: 160px;
  }
  #pet-canvas { image-rendering: pixelated; display: block; }

  /* inside the real Tauri window the pet fills it and debug hides.
     LEFT-anchored: the webview viewport under-reports the window width by
     ~12px, so a right-anchored canvas hangs its left ~12px outside the
     viewport — clipping leftmost art (the working clip's laptop) and
     skewing the window-relative hit-region by the same amount. */
  /* 110px bottom margin = the window's BUBBLE_ROOM (keep in sync with Rust).
     Horizontally CENTERED in the window: panels center on the sprite, and a
     left-anchored canvas made wide panels physically unable to align with
     the buddy. Both webview clip strips still fall on empty side padding
     (window ≥400 wide, canvas ≤280 at common scales). */
  body.tauri #pet-wrap { left: 50%; transform: translateX(-50%); bottom: 110px; right: auto; }
  body.tauri #debug { display: none; }

  #debug {
    position: fixed; top: 14px; left: 14px;
    background: rgba(20,20,24,.92); color: #ddd;
    border: 1px solid #444; border-radius: 10px;
    padding: 12px 14px; font-size: 12px;
    display: grid; gap: 8px; width: 240px;
  }
  #debug h1 { font-size: 13px; margin: 0 0 2px; color: #e89478; }
  #debug .states { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  #debug button {
    background: #33343c; color: #ddd; border: 1px solid #555;
    border-radius: 6px; padding: 5px 6px; font-size: 12px; cursor: pointer;
  }
  #debug button:hover { background: #44454f; }
  #debug button.active { background: #c1694f; color: #fff; border-color: #c1694f; }
  #debug label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #debug .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }

  /* session popover: opens above the buddy (into the window's standing
     headroom in Tauri), solid dark panel readable on any wallpaper */
  #popover {
    position: fixed; box-sizing: border-box;
    background: rgba(22, 22, 27, .96); color: #e6e0da;
    border: 1px solid #4a453f; border-radius: 12px;
    padding: 10px 12px; font-size: 12px; line-height: 1.35;
    max-height: 330px; overflow-y: auto;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  #popover .pop-head {
    font-weight: 600; color: #e89478; margin-bottom: 6px;
    display: flex; justify-content: space-between; gap: 8px;
  }
  #popover .pop-blind { color: #b9b2ab; font-style: italic; }
  /* Cowork watcher health: a second, quieter blindness line */
  #popover .pop-cowork { color: #b9b2ab; font-style: italic; font-size: 11px; margin: -2px 0 6px; }
  /* surface pill: Cowork rows carry one, Claude Code rows carry none */
  #popover .surface {
    flex: none; font-size: 9px; line-height: 1; padding: 3px 5px; border-radius: 8px;
    background: #3a3f4a; color: #c9d1dc; letter-spacing: .02em;
  }
  #popover .sess { padding: 5px 6px; margin: 0 -6px; border-top: 1px solid #33302c; cursor: pointer; border-radius: 6px; }
  #popover .sess:first-of-type { border-top: none; }
  #popover .sess:hover { background: rgba(255, 255, 255, .06); }
  body.panels-light #popover .sess:hover { background: rgba(0, 0, 0, .05); }
  #popover .sess .top { display: flex; align-items: center; gap: 6px; }
  #popover .dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  #popover .proj { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #popover .st { color: #b9b2ab; flex: none; }
  #popover .age { color: #8a857f; margin-left: auto; flex: none; }
  #popover .detail {
    color: #a29c95; margin: 2px 0 0 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #popover .empty { color: #a29c95; padding: 4px 0; }

  /* speech bubble: passive, non-interactive callout while Claude needs the
     user (or errored) — the ask must be readable without any clicking */
  /* clickable: a click jumps to the session that needs you */
  #bubble {
    position: fixed; cursor: pointer; box-sizing: border-box;
    background: rgba(22, 22, 27, .96); color: #e6e0da;
    border: 1px solid #e89478; border-radius: 12px;
    padding: 10px 14px; font-size: 14px; line-height: 1.35;
    max-width: 320px;
    box-shadow: 0 4px 18px rgba(0,0,0,.4);
  }
  #bubble:hover { border-color: #ffb08a; }
  #bubble.err { border-color: #7d7d92; }
  #bubble.err:hover { border-color: #a9a9c0; }
  #bubble .b-title { font-weight: 600; color: #e89478; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bubble.err .b-title { color: #a9a9c0; }
  #bubble .b-detail {
    color: #b9b2ab; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    word-break: break-word;
  }
  #bubble .b-tail {
    position: absolute; top: -6px; left: 50%; margin-left: -6px;
    width: 0; height: 0;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-bottom: 6px solid #e89478;
  }
  #bubble.err .b-tail { border-bottom-color: #7d7d92; }

  /* shared circular button family: the "+" and the gear are siblings */
  .round-btn {
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box; padding: 0; font: inherit;
    position: relative; /* anchors the invisible hit ring */
    background: rgba(22, 22, 27, .96); color: #e89478;
    border: 1px solid #e89478; border-radius: 50%;
    cursor: pointer; user-select: none;
  }
  /* invisible hit rings: a button's pseudo-element is part of its click
     target — the FORGIVING area extends well past the visible circle */
  #gearbtn::before, #newbtn::before {
    content: ''; position: absolute; inset: -8px; border-radius: 50%;
  }
  .round-btn:hover { background: #c1694f; color: #fff3ea; }
  /* CRITICAL: display:flex on .round-btn overrides the UA's [hidden] rule
     (author styles always beat UA styles) — without this the "+" is
     permanently visible, parked unpositioned at the window's top-left */
  .round-btn[hidden] { display: none; }
  /* hover "+": tiny, centered right below the buddy; opens a new Claude
     Code session in the desktop app. Yields to the speech bubble. */
  #newbtn {
    position: fixed; width: 18px; height: 18px;
    font-size: 13px; line-height: 1;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  #newbtn.clicked { background: #c1694f; color: #fff3ea; }
  /* popover gear: a real button — the visible circle IS the hit area. The
     glyph is forced to TEXT presentation ('Segoe UI Symbol' + VS15 in JS):
     emoji-style ⚙ renders bigger than the button and spills outside the
     clickable circle, making the icon feel only partially selectable. */
  /* NOTE: no overflow:hidden here — it would clip the ::before hit ring.
     Emoji-size spill is prevented by the VS15 glyph + Segoe UI Symbol. */
  #popover .gear {
    width: 28px; height: 28px; font-size: 15px;
    font-family: 'Segoe UI Symbol', 'Segoe UI', sans-serif;
    margin-left: auto; flex: none;
  }
  #popover .theme-row { display: flex; gap: 5px; margin: 2px 0 8px; align-items: center; }
  #popover .theme-row[hidden] { display: none; } /* flex would override [hidden] */
  #popover .theme-row .lbl { color: #8a857f; font-size: 11px; margin-right: 2px; }
  #popover .theme-row button {
    background: #33343c; color: #ddd; border: 1px solid #555;
    border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer;
  }
  #popover .theme-row button.active { background: #c1694f; border-color: #c1694f; color: #fff; }

  /* light theme for the panels (popover + bubble + plus button) */
  body.panels-light #popover, body.panels-light #bubble {
    background: rgba(247, 244, 240, .97); color: #3b3630; border-color: #c9beb4;
  }
  body.panels-light .round-btn {
    background: rgba(247, 244, 240, .97); color: #b05a3f; border-color: #c1694f;
  }
  body.panels-light .round-btn:hover { background: #c1694f; color: #fff3ea; }
  body.panels-light #popover .pop-head { color: #b05a3f; }
  body.panels-light #popover .sess { border-top-color: #e3dcd4; }
  body.panels-light #popover .st { color: #6f6862; }
  body.panels-light #popover .age { color: #8a8378; }
  body.panels-light #popover .detail, body.panels-light #popover .empty { color: #6f6862; }
  body.panels-light #popover .pop-blind { color: #8a8378; }
  body.panels-light #popover .pop-cowork { color: #8a8378; }
  body.panels-light #popover .surface { background: #dfe3ea; color: #4a5260; }
  body.panels-light #popover .theme-row button { background: #e7e0d8; color: #3b3630; border-color: #c9beb4; }
  body.panels-light #popover .theme-row button.active { background: #c1694f; border-color: #c1694f; color: #fff; }
  body.panels-light #bubble { border-color: #c1694f; }
  body.panels-light #bubble .b-title { color: #b05a3f; }
  body.panels-light #bubble.err { border-color: #8a8a9a; }
  body.panels-light #bubble.err .b-title { color: #6d6d84; }
  body.panels-light #bubble .b-detail { color: #6f6862; }
  body.panels-light #bubble .b-tail { border-bottom-color: #c1694f; }
  body.panels-light #bubble.err .b-tail { border-bottom-color: #8a8a9a; }
</style>
</head>
<body>

<div id="pet-wrap">
  <canvas id="pet-canvas"></canvas>
</div>

<!-- static skeleton: the gear and theme row are built ONCE and never
     replaced — a rebuilt button under a motionless cursor loses its hover
     state and eats clicks. Only #pop-sessions contents get re-rendered. -->
<div id="popover" hidden>
  <div class="pop-head">
    <span id="pop-count"></span>
    <span id="pop-blind" class="pop-blind" hidden></span>
    <button id="gearbtn" class="gear round-btn" title="panel theme">&#9881;&#xFE0E;</button>
  </div>
  <div id="pop-cowork" class="pop-cowork" hidden></div>
  <div id="theme-row" class="theme-row" hidden>
    <span class="lbl">theme:</span>
    <button data-theme="system">system</button>
    <button data-theme="dark">dark</button>
    <button data-theme="light">light</button>
  </div>
  <div id="art-row" class="theme-row" hidden>
    <span class="lbl">skin:</span>
    <button data-art="app">app</button>
    <button data-art="cli">cli</button>
  </div>
  <div id="pop-sessions"></div>
</div>
<div id="bubble" hidden></div>
<div id="newbtn" class="round-btn" hidden title="New Claude Code session">+</div>

<div id="debug">
  <h1>Claw'dbot debug</h1>
  <div class="states" id="state-buttons"></div>
  <div class="row"><span>size: <span id="size-readout">1.00×</span></span>
    <span style="color:#888">(+ / − keys, 0 resets)</span></div>
  <label><input type="checkbox" id="bg-light"> light desk</label>
</div>

<script type="module">
  import { Pet } from './pet.js';
  import { STYLES } from './styles.js';

  const IS_TAURI = !!window.__TAURI__;
  const invoke = IS_TAURI ? window.__TAURI__.core.invoke : null;

  // art style (app mascot / CLI mascot): persisted like the panel theme;
  // default app, so nothing changes for anyone who never touches the row
  let artStyle = 'app';
  try { artStyle = localStorage.getItem('artStyle') || 'app'; } catch {}
  if (!STYLES[artStyle]) artStyle = 'app';

  // the demo panel's state list follows the active style (soccer is app-only)
  let STATES = Object.keys(STYLES[artStyle].clips);

  // forgiveness halo (CSS px) around the sprite's envelope: part of the OS
  // hit region (reportBounds) AND of the buddy's own press region (onBuddy),
  // so a near-miss grab drags the buddy instead of merely focusing the
  // window; it also covers the buttons' invisible 8px hit rings
  const HALO = 20;

  let savedScale = 1.75;
  try { savedScale = parseFloat(localStorage.getItem('petScale')) || 1.75; } catch {}

  const canvas = document.getElementById('pet-canvas');
  const wrap = document.getElementById('pet-wrap');
  const pet = new Pet(canvas, IS_TAURI ? 1 : savedScale, artStyle);

  function reportBounds() {
    if (!IS_TAURI) return;
    // page-relative, not canvas-relative: the window is padded larger than
    // the canvas (so the webview's clipped edge falls on empty space), so
    // the wrap's offset must be folded into the hit-test bounds. While the
    // popover is open, the clickable rect is the union of buddy + panel.
    const b = pet.opaqueBounds();
    const r = wrap.getBoundingClientRect();
    let x = b.x + r.left, y = b.y + r.top;
    let right = x + b.w, bottom = y + b.h;
    if (!popEl.hidden) {
      const pr = popEl.getBoundingClientRect();
      x = Math.min(x, pr.left); y = Math.min(y, pr.top);
      right = Math.max(right, pr.right); bottom = Math.max(bottom, pr.bottom);
    }
    if (!btnEl.hidden) {
      const br = btnEl.getBoundingClientRect();
      x = Math.min(x, br.left); y = Math.min(y, br.top);
      right = Math.max(right, br.right); bottom = Math.max(bottom, br.bottom);
    }
    if (!bubEl.hidden) {
      // the bubble is clickable (jump-to-session) — it needs OS-level hits
      const ur = bubEl.getBoundingClientRect();
      x = Math.min(x, ur.left); y = Math.min(y, ur.top);
      right = Math.max(right, ur.right); bottom = Math.max(bottom, ur.bottom);
    }
    // the forgiveness halo keeps near-miss clicks on the window (and on the
    // buddy, see onBuddy) instead of letting them fall through to the desktop
    x -= HALO; y -= HALO; right += HALO; bottom += HALO;
    // report in PHYSICAL px: devicePixelRatio is the exact CSS->physical
    // factor including any webview zoom. Rust must NOT convert with the
    // monitor scale factor — zoom made them disagree (~10%), which shifted
    // the OS-level clickable region off the real controls (the tiny "+"
    // ended up entirely outside it while the big popover absorbed the error)
    const dpr = window.devicePixelRatio || 1;
    invoke('set_opaque_bounds', { x: x * dpr, y: y * dpr, w: (right - x) * dpr, h: (bottom - y) * dpr });
  }

  // --- hover "+": shows by the buddy's shoulder while the cursor is over
  //     him (or the button itself); opens a new Claude Code session ---
  const btnEl = document.getElementById('newbtn');
  let btnHideTimer = null;

  function showNewBtn() {
    clearTimeout(btnHideTimer);
    btnHideTimer = null;
    // the popover and the speech bubble both supersede it (the bubble owns
    // the below-the-buddy spot)
    if (!btnEl.hidden || !popEl.hidden || !bubEl.hidden) return;
    const r = wrap.getBoundingClientRect();
    const rb = pet.restBounds();
    const feetCss = r.top + (rb.y + rb.h) * pet.scale;
    btnEl.style.top = (feetCss + 6) + 'px';
    btnEl.hidden = false;
    placeCenteredOnBuddy(btnEl);
    reportBounds();
  }

  function scheduleHideNewBtn() {
    clearTimeout(btnHideTimer);
    // generous grace: an overshoot past the button and back must never
    // kill it mid-aim
    btnHideTimer = setTimeout(() => {
      btnEl.hidden = true;
      reportBounds();
    }, 1200);
  }

  // Showing: genuine sprite hover. Hiding on the DESKTOP: only the Rust
  // pet-hover signal (cursor truly left the sprite+button+halo region) —
  // DOM-side timers raced the user while traveling down to the button.
  // The browser demo has no Rust poller, so it keeps DOM-based hiding.
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    if (pet.hitTest(e.clientX - rect.left, e.clientY - rect.top)) showNewBtn();
    else if (!IS_TAURI) scheduleHideNewBtn();
  });
  canvas.addEventListener('mouseleave', () => { if (!IS_TAURI) scheduleHideNewBtn(); });
  btnEl.addEventListener('mouseenter', () => { clearTimeout(btnHideTimer); btnHideTimer = null; });
  btnEl.addEventListener('mouseleave', () => { if (!IS_TAURI) scheduleHideNewBtn(); });
  btnEl.addEventListener('click', () => {
    if (IS_TAURI) invoke('open_new_code_session');
    // visible confirmation: a terracotta pulse, then the button retires
    // (no wave — the user prefers the pet not to react to new sessions)
    btnEl.classList.add('clicked');
    setTimeout(() => {
      btnEl.classList.remove('clicked');
      btnEl.hidden = true;
      reportBounds();
    }, 600);
  });

  // --- session popover: click the buddy to toggle a live list of every
  //     Claude session the pipeline knows about ---
  const popEl = document.getElementById('popover');
  let lastPipelineAt = 0; // when lastPipeline was received (ages drift live)

  // --- panel theme: system / dark / light for the popover + bubble.
  //     The gear and theme row are STATIC elements (see the HTML skeleton):
  //     rebuilding them on refresh dropped hover state and ate clicks. ---
  const popCount = document.getElementById('pop-count');
  const popBlind = document.getElementById('pop-blind');
  const popCowork = document.getElementById('pop-cowork');
  const popSessions = document.getElementById('pop-sessions');
  const themeRow = document.getElementById('theme-row');
  const artRow = document.getElementById('art-row');
  const gearBtn = document.getElementById('gearbtn');

  let panelTheme = 'system';
  try { panelTheme = localStorage.getItem('panelTheme') || 'system'; } catch {}
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  function applyPanelTheme() {
    const light = panelTheme === 'light' || (panelTheme === 'system' && !darkQuery.matches);
    document.body.classList.toggle('panels-light', light);
  }
  function syncThemeButtons() {
    themeRow.querySelectorAll('button[data-theme]').forEach((b) => {
      b.classList.toggle('active', panelTheme === b.dataset.theme);
    });
  }
  function setPanelTheme(t) {
    panelTheme = t;
    try { localStorage.setItem('panelTheme', t); } catch {}
    applyPanelTheme();
    syncThemeButtons();
  }
  darkQuery.addEventListener('change', () => { if (panelTheme === 'system') applyPanelTheme(); });
  applyPanelTheme();
  syncThemeButtons();
  // the gear shows/hides the settings rows together (theme + art)
  gearBtn.onclick = (e) => {
    e.stopPropagation();
    const show = themeRow.hidden;
    themeRow.hidden = !show;
    artRow.hidden = !show;
    reportBounds();
  };
  themeRow.querySelectorAll('button[data-theme]').forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); setPanelTheme(b.dataset.theme); };
  });

  // --- art style row: swaps the buddy's whole clip set in place; the hit
  //     region and the demo state list follow the new style ---
  function syncArtButtons() {
    artRow.querySelectorAll('button[data-art]').forEach((b) => {
      b.classList.toggle('active', artStyle === b.dataset.art);
    });
  }
  function setArtStyle(name) {
    if (!STYLES[name]) return;
    artStyle = name;
    try { localStorage.setItem('artStyle', name); } catch {}
    pet.setStyle(name);
    syncArtButtons();
    STATES = Object.keys(pet.style.clips);
    buildStateButtons();
    reportBounds();
  }
  syncArtButtons();
  artRow.querySelectorAll('button[data-art]').forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); setArtStyle(b.dataset.art); };
  });

  const POP_RANK = { needs_input: 6, error: 5, working: 3, thinking: 3, done: 2, idle: 1 };
  const POP_COLOR = {
    needs_input: '#e89478', error: '#7d7d92', working: '#c1694f',
    thinking: '#c9a15f', done: '#9ab98f', idle: '#8a8a8a',
  };

  function fmtAge(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm';
    return Math.floor(m / 60) + 'h' + (m % 60) + 'm';
  }

  // last path segment; recovered sessions carry a mangled slug with no
  // slashes, where the tail after the final dash is the project name
  function projName(cwd) {
    const parts = (cwd || '').split(/[\\/]/).filter(Boolean);
    let last = parts[parts.length - 1] || '';
    if (parts.length <= 1 && last.includes('-')) last = last.split('-').pop();
    return last || '(unknown)';
  }

  function renderPopover() {
    if (popEl.hidden) return;
    const p = lastPipeline;
    const drift = lastPipelineAt ? Date.now() - lastPipelineAt : 0;
    popSessions.textContent = '';
    if (!p) {
      popCount.textContent = IS_TAURI ? 'waiting for session data…' : 'browser demo — no pipeline';
      popBlind.hidden = true;
      popCowork.hidden = true;
      return;
    }
    const n = p.sessions.length;
    popCount.textContent = n + (n === 1 ? ' session' : ' sessions');
    popBlind.hidden = !p.blind;
    if (p.blind) popBlind.textContent = 'blind: ' + p.detail;
    popCowork.hidden = !p.cowork_health;
    if (p.cowork_health) popCowork.textContent = 'cowork: ' + p.cowork_health;
    if (!n) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'no active sessions';
      popSessions.appendChild(e);
      return;
    }
    const rows = [...p.sessions].sort((a, b) =>
      (POP_RANK[b.state] || 0) - (POP_RANK[a.state] || 0) || a.since_ms - b.since_ms);
    for (const s of rows) {
      const row = document.createElement('div');
      row.className = 'sess';
      row.title = 'open this session in the Claude app';
      row.onclick = () => openLink(sessionLink(s));
      const top = document.createElement('div');
      top.className = 'top';
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = POP_COLOR[s.state] || '#8a8a8a';
      const proj = document.createElement('span');
      proj.className = 'proj';
      proj.textContent = rowName(s);
      proj.title = s.cwd || s.title || s.id;
      const st = document.createElement('span');
      st.className = 'st';
      st.textContent = s.state.replace('_', ' ') + (s.busy && s.tools && s.tools.length ? ' · ' + s.tools[0] : '');
      const age = document.createElement('span');
      age.className = 'age';
      age.dataset.since = s.since_ms;
      age.textContent = fmtAge(s.since_ms + drift);
      top.append(dot, proj);
      if (s.surface === 'cowork') {
        const pill = document.createElement('span');
        pill.className = 'surface';
        pill.textContent = 'Cowork';
        top.appendChild(pill);
      }
      top.append(st, age);
      row.appendChild(top);
      if (s.detail) {
        const d = document.createElement('div');
        d.className = 'detail';
        d.textContent = s.detail;
        d.title = s.detail;
        row.appendChild(d);
      }
      popSessions.appendChild(row);
    }
  }

  // ONE centering rule for every panel: sprite center is the reference,
  // widths are border-box, clamps are identical — the elements cannot drift
  // apart from each other or from the buddy.
  function placeCenteredOnBuddy(el, cssWidth) {
    if (cssWidth != null) el.style.width = cssWidth + 'px';
    const r = wrap.getBoundingClientRect();
    const rb = pet.restBounds();
    const center = r.left + (rb.x + rb.w / 2) * pet.scale;
    const box = el.getBoundingClientRect().width;
    el.style.left = Math.max(8, Math.min(center - box / 2, window.innerWidth - box - 8)) + 'px';
  }

  function positionPopover() {
    placeCenteredOnBuddy(popEl, Math.min(260, window.innerWidth - 16));
    // anchor just above the buddy — but above the TALLEST common frames so
    // the panel never covers the character: working's away frames top out at
    // canvas unit 52 (hop, wave and idle all stay lower). Only the transient
    // done-flag tip reaches higher and briefly slips behind the panel.
    const r = wrap.getBoundingClientRect();
    const SPRITE_CLEAR_UNIT = 52;
    const clearTopCss = r.top + SPRITE_CLEAR_UNIT * pet.scale;
    popEl.style.bottom = (window.innerHeight - clearTopCss + 10) + 'px';
  }

  function setPopover(open) {
    if (popEl.hidden === !open) return;
    popEl.hidden = !open;
    if (open) { positionPopover(); renderPopover(); btnEl.hidden = true; }
    else { themeRow.hidden = true; artRow.hidden = true; } // reopening always starts on the session list
    updateBubble();
    reportBounds();
  }
  // ages tick in place — never a full DOM rebuild, which could swallow a
  // click landing mid-press (e.g. on the gear)
  function updateAges() {
    if (popEl.hidden || !lastPipelineAt) return;
    const drift = Date.now() - lastPipelineAt;
    popEl.querySelectorAll('.age[data-since]').forEach((el) => {
      el.textContent = fmtAge(Number(el.dataset.since) + drift);
    });
  }
  setInterval(updateAges, 1000);
  window.addEventListener('blur', () => setPopover(false));

  // --- speech bubble: the ask, readable with zero clicks. Shows while the
  //     reduced state is needs_input or error; the popover supersedes it. ---
  const bubEl = document.getElementById('bubble');
  bubEl.addEventListener('click', () => openLink(bubEl.dataset.link));
  // a row's display name: the session title when the source knows one
  // (Cowork toasts carry it), else the project folder (a Cowork row's cwd
  // is its first granted folder name)
  function rowName(s) {
    if (s.title) return s.title;
    if (s.cwd) return projName(s.cwd);
    return s.surface === 'cowork' ? 'Cowork session' : '(unknown)';
  }
  // jump-to-session deep links (read from the Claude app's own bundle,
  // app 1.46388.4, verified live 2026-09-05). Both surfaces go through the
  // app's claude.ai path handler, which has NO feature flag: a Cowork row
  // opens /cowork/<cse id>; a Claude Code row opens /epitaxy/<app session
  // id> — the app's own route for a local session (its crash-reporter
  // scope records the main window at exactly that URL). The app id
  // (local_<uuid>) comes from the desktop log (link_id); the CLI uuid the
  // hooks report is useless to the app. The claude://code/continue and
  // code/needs-input forms are gated by a server flag that flipped off
  // mid-session, so they are only the fallback when no app id is known.
  function sessionLink(s) {
    if (s.surface === 'cowork') {
      if (s.link_id) return 'claude://claude.ai/cowork/' + encodeURIComponent(s.link_id) + '?source=desktop_action';
      return 'claude://code/needs-input?source=desktop_action';
    }
    if (s.link_id) return 'claude://claude.ai/epitaxy/' + encodeURIComponent(s.link_id) + '?source=desktop_action';
    if (s.state === 'needs_input') return 'claude://code/needs-input?source=desktop_action';
    return 'claude://code/continue?session=last&source=desktop_action';
  }
  function openLink(url) {
    if (IS_TAURI && url) invoke('open_claude_link', { url });
  }

  const KIND_TEXT = {
    permission: 'needs permission',
    idle_prompt: 'is waiting on you',
    agent_needs_input: 'needs your input',
    elicitation_dialog: 'is asking a question',
    elicitation: 'is asking a question',
    unknown: 'wants something',
  };

  function updateBubble() {
    const p = lastPipeline;
    const show = p && (p.state === 'needs_input' || p.state === 'error') && popEl.hidden;
    bubEl.hidden = !show;
    if (!show) return;
    btnEl.hidden = true; // the bubble owns the spot below the buddy
    // the top session (same priority sort as the popover) names the project
    const rows = [...p.sessions].sort((a, b) =>
      (POP_RANK[b.state] || 0) - (POP_RANK[a.state] || 0) || a.since_ms - b.since_ms);
    const top = rows[0];
    bubEl.dataset.link = top ? sessionLink(top) : '';
    bubEl.classList.toggle('err', p.state === 'error');
    bubEl.textContent = '';
    const t = document.createElement('div');
    t.className = 'b-title';
    t.textContent = p.state === 'error'
      ? (top ? rowName(top) + ' hit an error' : 'something went wrong')
      : (top ? rowName(top) + ' ' + (KIND_TEXT[p.kind] || KIND_TEXT.unknown) : 'Claude ' + (KIND_TEXT[p.kind] || KIND_TEXT.unknown));
    bubEl.appendChild(t);
    if (p.detail) {
      const d = document.createElement('div');
      d.className = 'b-detail';
      d.textContent = p.detail;
      bubEl.appendChild(d);
    }
    const tail = document.createElement('div');
    tail.className = 'b-tail';
    bubEl.appendChild(tail);
    // centered under the buddy, hanging just below the feet (GROUND line),
    // tail pointing up at him; the bubble hugs its text up to maxWidth
    const r = wrap.getBoundingClientRect();
    const rb = pet.restBounds();
    const feetCss = r.top + (rb.y + rb.h) * pet.scale;
    bubEl.style.bottom = 'auto';
    bubEl.style.top = (feetCss + 10) + 'px';
    bubEl.style.maxWidth = Math.min(320, window.innerWidth - 16) + 'px';
    placeCenteredOnBuddy(bubEl);
  }

  pet.on('scale', (s) => {
    wrap.style.width = (160 * s) + 'px';
    wrap.style.height = (160 * s) + 'px';
    document.getElementById('size-readout').textContent = s.toFixed(2) + '×';
    try { localStorage.setItem('petScale', String(s)); } catch {}
  });

  // --- debug panel ---
  const btns = document.getElementById('state-buttons');
  function buildStateButtons() {
    btns.textContent = '';
    STATES.forEach((s) => {
      const b = document.createElement('button');
      b.textContent = s.replace('_', ' ');
      b.dataset.state = s;
      b.onclick = () => setState(s);
      b.classList.toggle('active', s === pet.state);
      btns.appendChild(b);
    });
  }
  buildStateButtons();

  function setState(s) {
    pet.setState(s);
  }
  // the active chip follows the pet's actual state, so self-driven changes
  // (auto-sleep, auto-wake) stay visible in the panel too
  pet.on('state', ({ state }) => {
    [...btns.children].forEach((b) => b.classList.toggle('active', b.dataset.state === state));
  });

  document.getElementById('bg-light').onchange = (e) => {
    document.body.classList.toggle('demo-light', e.target.checked);
    document.body.classList.toggle('demo-dark', !e.target.checked);
  };

  // --- resize: + / − keys while the pet window is focused (click it first);
  //     0 resets to the default size ---
  const DEFAULT_SCALE = 1.75;
  function resizeTo(next) {
    pet.setScale(next);
    if (IS_TAURI) {
      invoke('set_pet_scale', { scale: pet.scale });
      reportBounds();
    }
  }

  // --- keyboard: +/−/0 resize everywhere; q quits the desktop pet (by
  //     design). Number-key state forcing, d (debug panel) and r (reload)
  //     are BROWSER-DEMO ONLY: on the real pet the pipeline owns the state,
  //     and a stray keypress after a click must not fake it or reload. ---
  document.addEventListener('keydown', (e) => {
    const n = parseInt(e.key, 10);
    if (e.key === '0') resizeTo(DEFAULT_SCALE);
    else if (!IS_TAURI && n >= 1 && n <= STATES.length) setState(STATES[n - 1]);
    else if (e.key === '+' || e.key === '=') resizeTo(pet.scale * 1.15);
    else if (e.key === '-' || e.key === '_') resizeTo(pet.scale / 1.15);
    else if (e.key === 'd' && !IS_TAURI) {
      const dbg = document.getElementById('debug');
      dbg.style.display = dbg.style.display === 'grid' ? 'none' : 'grid';
    } else if (e.key === 'r' && !IS_TAURI) location.reload();
    else if (e.key === 'q' && IS_TAURI) invoke('quit_app');
    else if (e.key === 'Escape') setPopover(false);
  });

  // --- waking: any grab of the buddy (click or the start of a drag) ends a
  //     nap early; registered before the drag block so it never depends on it ---
  // The OS-level hit region is the sprite's envelope plus the HALO (see
  // reportBounds), so a press anywhere in that ring reaches this window and
  // must belong to the buddy — with canvas-only listeners a near-miss grab
  // merely focused the window and did nothing. Panels sit inside the same
  // ring and keep their own clicks.
  function onBuddy(e) {
    if (e.target && e.target.closest && e.target.closest('#popover, #bubble, #newbtn, #debug')) return false;
    const rect = canvas.getBoundingClientRect();
    const b = pet.opaqueBounds();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    return x >= b.x - HALO && x < b.x + b.w + HALO && y >= b.y - HALO && y < b.y + b.h + HALO;
  }

  document.addEventListener('pointerdown', (e) => {
    if (pet.state === 'sleeping' && onBuddy(e)) setState('idle');
  });

  // --- drag: press + >2px movement drags the window; a plain click toggles
  //     the session popover. The window is moved by Rust (set_position from
  //     its poller thread), NOT by the OS move loop: tao gives even this
  //     undecorated window WS_CAPTION, so Windows treated the invisible
  //     popover headroom as a title bar and popped the window down on
  //     mouse-up whenever that empty air sat above the screen top — the buddy
  //     landed somewhere other than where it was released. Pointer capture
  //     (on the body: the press region is wider than the canvas) keeps every
  //     move/up flowing even when the cursor outruns the window, so the
  //     press state can never go stale. ---
  if (IS_TAURI) {
    let down = null, dragging = false;
    const clear = () => { down = null; dragging = false; };
    const endDrag = () => { if (dragging) invoke('end_drag'); clear(); };
    document.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || !onBuddy(e)) return;
      down = { x: e.screenX, y: e.screenY };
      dragging = false;
      // capture is an optimisation (moves keep flowing when the cursor
      // outruns the window), not a precondition: a synthesised press with
      // no active button makes it throw, and the press must still count
      try { document.body.setPointerCapture(e.pointerId); } catch {}
    });
    document.addEventListener('pointermove', (e) => {
      if (!down || dragging) return;
      if (!(e.buttons & 1)) { clear(); return; } // released while out of view
      if (Math.hypot(e.screenX - down.x, e.screenY - down.y) > 2) {
        dragging = true;
        // Rust anchors the grab at the PRESS point (physical px) and follows
        // the cursor from there, so the movement before this IPC lands is
        // never lost and the buddy stays exactly under the grabbed pixel
        const dpr = window.devicePixelRatio || 1;
        invoke('start_drag', { x: down.x * dpr, y: down.y * dpr });
      }
    });
    document.addEventListener('pointerup', (e) => {
      if (e.button !== 0) return;
      // a press that never turned into a drag is a plain click: the popover
      if (down && !dragging) setPopover(popEl.hidden);
      endDrag();
    });
    document.addEventListener('pointercancel', endDrag);
    document.addEventListener('lostpointercapture', endDrag);
    window.addEventListener('blur', endDrag);
  } else {
    // browser demo: plain click toggles the popover too (layout testing)
    document.addEventListener('click', (e) => { if (onBuddy(e)) setPopover(popEl.hidden); });
  }

  // --- pipeline truth (Tauri): the last state received from the Rust
  //     reducer. The greeting and any local flourish always return here. ---
  let lastPipeline = null;
  function recordPipeline(p) {
    lastPipeline = p;
    lastPipelineAt = Date.now();
    renderPopover(); // no-op while hidden
    updateBubble();
    // the bubble/popover just changed shape: without this the OS hit region
    // kept the LAST reported rect and a fresh needs-input bubble was
    // click-through until the cursor had crossed the sprite and 1.2s passed
    reportBounds();
  }
  function applyPipeline(p) {
    if (!p) return;
    recordPipeline(p);
    // guard: a reducer bug or version skew must never crash the render loop
    try { setState(p.state, p.detail); } catch (err) { console.error('bad pet-state', p, err); }
  }

  // greet the fresh app launch with a smiling wave, then settle into truth:
  // the reducer's state in Tauri (sleeping until events say otherwise), the
  // idle demo in the browser. 1875ms lands mid-way through the 4th cycle's
  // arm-DOWN frame (cycle 500ms, down half at 250-500), so with the clip's
  // arm-down outro the gesture always completes instead of cutting off.
  // (guard: skip the handoff if something else changed the state meanwhile)
  setState('wave');
  setTimeout(() => {
    if (pet.state !== 'wave') return;
    if (!IS_TAURI) { setState('idle'); return; }
    if (lastPipeline) applyPipeline(lastPipeline);
    else setState('sleeping'); // no events yet; the snapshot may still land
  }, 1875);

  // Tauri host wiring. The demo desk background is only ever added in browser
  // mode, so a script failure can never paint the transparent window opaque.
  if (IS_TAURI) {
    document.body.classList.add('tauri');
    // the bottom-anchored wrap only moves once the window resize lands in
    // the webview, so the hit region must be re-measured on resize (a +/−/0
    // step used to report bounds against the OLD viewport)
    window.addEventListener('resize', reportBounds);
    // Rust owns the scale (it restores it from config). Never derive scale
    // from the viewport: the webview's innerWidth under-reports the window
    // size by ~12px, and a viewport-derived scale ratchets downward forever.
    invoke('get_pet_scale').then((s) => {
      pet.setScale(s);
      reportBounds();
    });

    // Event pipeline: listener FIRST, then the snapshot, so a stale snapshot
    // can never overwrite a raced-in live event. During the boot wave,
    // arriving states are recorded but only attention states cut in.
    const { listen } = window.__TAURI__.event;
    // Rust's cursor poller is the hover ground truth: after the window
    // starts ignoring cursor events, DOM mouseleave can never fire, so the
    // "+" would stick around forever without this
    listen('pet-hover', (e) => {
      // entering the pet's vicinity summons the "+"; leaving it hides it
      // after the grace. No sprite-precision hover, no DOM timers to race.
      if (e.payload) showNewBtn();
      else scheduleHideNewBtn();
    });
    listen('pet-state', (e) => {
      const p = e.payload;
      if (pet.state === 'wave' && p.state !== 'needs_input' && p.state !== 'error') {
        recordPipeline(p); // the handoff will apply it
        return;
      }
      applyPipeline(p);
    }).then(() => invoke('get_pet_state'))
      .then((p) => {
        if (!p || lastPipeline) return; // a live event already superseded it
        if (pet.state === 'wave') recordPipeline(p);
        else applyPipeline(p);
      });
  } else {
    document.body.classList.add('demo-dark');
    pet._emit('scale', pet.scale); // sync wrap size + readout to restored scale
  }

  // debug/test handle
  window.__clawdbot = { pet, setState, setStyle: setArtStyle, setPopover, renderPopover, get lastPipeline() { return lastPipeline; } };
</script>
</body>
</html>
